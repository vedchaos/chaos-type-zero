# ============================================================
# CHAOS TYPE ZERO — Service
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: ctz-service
  namespace: chaos-type-zero
  labels:
    app.kubernetes.io/name: chaos-type-zero
    app.kubernetes.io/component: service
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
spec:
  type: LoadBalancer
  selector:
    app: ctz-dashboard
  ports:
    - name: dashboard
      port: 80
      targetPort: 8080
      protocol: TCP
    - name: api
      port: 8081
      targetPort: 8081
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
---
# ============================================================
# CHAOS TYPE ZERO — MCP Service
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: ctz-mcp-service
  namespace: chaos-type-zero
  labels:
    app.kubernetes.io/name: chaos-type-zero
    app.kubernetes.io/component: mcp-service
spec:
  type: ClusterIP
  selector:
    app: ctz-mcp-workers
  ports:
    - name: mcp
      port: 3000
      targetPort: 3000
      protocol: TCP
