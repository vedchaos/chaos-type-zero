# ============================================================
# CHAOS TYPE ZERO — Ingress
# ============================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ctz-ingress
  namespace: chaos-type-zero
  labels:
    app.kubernetes.io/name: chaos-type-zero
    app.kubernetes.io/component: ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - ctz.yourdomain.com
      secretName: ctz-tls
  rules:
    - host: ctz.yourdomain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ctz-service
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: ctz-service
                port:
                  number: 8081
          - path: /metrics
            pathType: Prefix
            backend:
              service:
                name: ctz-service
                port:
                  number: 9090
