# ============================================================
# CHAOS TYPE ZERO — NetworkPolicy
# ============================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ctz-network-policy
  namespace: chaos-type-zero
  labels:
    app.kubernetes.io/name: chaos-type-zero
    app.kubernetes.io/component: network
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: chaos-type-zero
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow dashboard from anywhere
    - ports:
        - port: 8080
          protocol: TCP
    # Allow API from dashboard
    - from:
        - podSelector:
            matchLabels:
              app: ctz-dashboard
      ports:
        - port: 8081
          protocol: TCP
    # Allow metrics from Prometheus
    - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
      ports:
        - port: 9090
          protocol: TCP
  egress:
    # Allow DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Allow HTTPS (for LLM providers)
    - ports:
        - port: 443
          protocol: TCP
    # Allow internal MCP communication
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: chaos-type-zero
      ports:
        - port: 3000
          protocol: TCP
