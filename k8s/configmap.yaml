# ============================================================
# CHAOS TYPE ZERO — ConfigMap
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: ctz-config
  namespace: chaos-type-zero
  labels:
    app.kubernetes.io/name: chaos-type-zero
    app.kubernetes.io/component: config
data:
  # CTZ Configuration
  CTZ_VERSION: "3.2"
  CTZ_MODE: "production"
  CTZ_LOG_LEVEL: "info"
  CTZ_DASHBOARD_PORT: "8080"
  CTZ_API_PORT: "8081"
  CTZ_PROMETHEUS_PORT: "9090"

  # MCP Servers
  CTZ_MCP_SERVERS: "71"
  CTZ_MCP_TOOLS: "316"

  # Memory
  CTZ_MEMORY_BACKEND: "sqlite"
  CTZ_MEMORY_MAX_SIZE: "1GB"

  # Security
  CTZ_VAULT_ENABLED: "true"
  CTZ_VAULT_XOR_KEY: "chaos2024"

  # Providers
  CTZ_DEFAULT_PROVIDER: "ollama"

  # opencode.json (mounted as file)
  opencode.json: |
    {
      "version": "3.2",
      "name": "CHAOS TYPE ZERO",
      "mode": "production"
    }
